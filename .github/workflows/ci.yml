name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Mozilla add-on linter
        run: pnpm lint:firefox
      - name: Build the Firefox and Chrome packages
        run: sh scripts/pack-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
