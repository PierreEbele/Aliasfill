name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # addons.mozilla.org API credentials (repository secrets); without them the AMO step is skipped.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # Microsoft Edge Add-ons Publish API (Partner Center → Microsoft Edge → Publish API); without them the Edge step is skipped.
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint:firefox
      - name: Check the tag matches the manifest version
        run: test "v$(node -p 'require("./extension/manifest.json").version')" = "$GITHUB_REF_NAME"
      - run: sh scripts/pack-extension.sh
      - name: Publish a GitHub release with both packages
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Aliasfill $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Submit the new version to addons.mozilla.org
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        # Listed channel: Mozilla reviews the version, then publishes and signs it (Firefox updates users automatically).
        # --approval-timeout 0: the job does not wait for the review.
        run: >-
          pnpm exec web-ext sign --source-dir extension --ignore-files "store/**" --channel listed
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 0
      - name: Submit the new version to Microsoft Edge Add-ons
        if: env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != ''
        # The Chrome package; Microsoft reviews it, the job does not wait for the review.
        run: node scripts/publish-edge.mjs "dist/aliasfill-${GITHUB_REF_NAME#v}-chrome.zip"
